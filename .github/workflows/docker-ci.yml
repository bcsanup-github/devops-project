name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker  build -t devops-flask-app . 
      
      - name: Verify Docker Image
        run: docker images